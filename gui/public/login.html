<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>ログイン · Coincheck Local</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/login.js"></script>
</head>
<body class="login-page">
  <main class="panel login-panel">
    <p class="eyebrow">Coincheck LOCAL</p>
    <h1>自分の取引デスクへ</h1>
    <p class="login-description">サーバー起動時に設定した GUI 専用パスワードを入力してください。</p>
    <form id="login-form" autocomplete="off">
      <label for="login-password">GUI パスワード</label>
      <input id="login-password" type="password" autocomplete="current-password" required maxlength="1024" autofocus>
      <button id="login-submit" type="submit" class="primary-button">ログイン</button>
    </form>
    <p id="login-result" role="status" aria-live="polite"></p>
    <p class="footnote">Coincheck のログインパスワードや API キーではありません。ログインの有効期限は 8 時間です。</p>
  </main>
</body>
</html>
